name: CI

on:
  push:
    branches: ['**']
    tags: ['step/*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Ровно то же, что запускается локально перед коммитом: формат, типы, линтер, тесты.
      - run: npm run verify

      # Сборка и бюджет: скрипт падает сам, если бандл вырос больше 200 КиБ gzip.
      - run: npm run build
      - run: npm run size
