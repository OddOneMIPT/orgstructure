server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Сжимаем на лету. `gzip_static` не используем: Vite не кладёт рядом .gz,
  # а тянуть ради этого плагин пре-сжатия — лишняя зависимость (ADR 008).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css
    text/plain;

  # Хэш в имени файла — содержимое по адресу больше не изменится.
  location /assets/ {
    # Один заголовок, а не expires + add_header: вместе они дают два Cache-Control.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html всегда перепроверяется, иначе пользователь застрянет на старой сборке.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ответ сжимается: application/json есть в gzip_types, и браузер шлёт
    # Accept-Encoding: gzip. При сжатии nginx помечает ETag слабым —
    # etag: W/"<epoch>.<version>". Это осознанно: ревизия в нём сохраняется,
    # parseRevision снимает префикс W/ (тест в packages/contracts), а условный
    # запрос всё равно отдаёт 304. gzip_proxied здесь ни при чём: он про запросы,
    # пришедшие через ещё один прокси (по заголовку Via), а не про ответы upstream.
  }

  location /ws {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    # Больше интервала heartbeat (15 с), иначе nginx рвал бы живое соединение.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
